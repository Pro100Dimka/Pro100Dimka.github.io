<section id="portfolio" aria-labelledby="portfolio-title">
    <h2 id="portfolio-title">Портфоліо</h2>
    <p class="lead">Пара прикладів робіт «до/після». Опис вказує вид робіт і термін виконання.</p>

    <div class="slider" aria-roledescription="carousel" aria-label="Портфоліо">
        <div class="slides" id="slides">
            <!-- Slide 1 -->
            <figure class="slide" aria-label="Приклад 1: ремонт ванної">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700'><rect width='100%' height='100%' fill='%23eef6ff'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='28' fill='%23354d6c'>Приклад 1 — До / Після (замініть на реальні фото)</text></svg>"
                    alt="Приклад 1 до/після">
                <figcaption>Ремонт санвузла — 10 днів, комплексні роботи: демонтаж, електрика, плитка.
                </figcaption>
            </figure>

            <!-- Slide 2 -->
            <figure class="slide" aria-label="Приклад 2: укладення плитки">
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700'><rect width='100%' height='100%' fill='%23fff6ee'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='28' fill='%23354d6c'>Приклад 2 — До / Після (замініть на реальні фото)</text></svg>"
                    alt="Приклад 2 до/після">
                <figcaption>Укладання плитки в кухні — 5 днів.</figcaption>
            </figure>
        </div>

        <div class="slider-controls">
            <button class="small-btn" onclick="prevSlide()" aria-label="Попередній">◀</button>
            <button class="small-btn" onclick="nextSlide()" aria-label="Наступний">▶</button>
        </div>
    </div>
</section>
