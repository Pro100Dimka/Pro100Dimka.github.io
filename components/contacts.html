<section id="contacts" aria-labelledby="contacts-title">
    <h2 id="contacts-title">Контакти</h2>
    <p class="lead">Телефон, форма зворотного зв'язку та карта.</p>

    <div style="display:grid;grid-template-columns:1fr;gap:12px">
        <div class="hero-card">
            <!-- FORM: default configured for Formspree (замініть {your-id}) -->
            <h3>Зв'язатися з нами</h3>
            <form id="contactForm" action="https://formspree.io/f/{your-id}" method="POST"
                onsubmit="return validateAndSend(event)">
                <label for="name">Ім'я *</label>
                <input type="text" id="name" name="name" required placeholder="Ім'я">

                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone" required placeholder="+380XXXXXXXXX"
                    pattern="^\+?[\d\s\-()]{7,}$">

                <label for="message">Повідомлення</label>
                <textarea id="message" name="message" rows="4" placeholder="Коротко опишіть завдання"></textarea>

                <!-- hidden field to help Formspree -->
                <input type="hidden" name="_subject" value="Нове звернення з сайту Рембуд">

                <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
                    <button class="btn" type="submit">Відправити</button>
                    <a class="ghost" href="mailto:info@rembud.example">Написати на Email</a>
                </div>
                <p id="formMsg" class="slogan" style="margin-top:8px;color:var(--muted)"></p>
            </form>
        </div>

        <div class="hero-card">
            <h3>Карта</h3>
            <p class="slogan">Вбудуйте Google Maps або Yandex Maps замість цього блоку. Нижче — приклади.</p>
            <!-- Example: Google Maps iframe (замініть src на свій) -->
            <!--
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." width="100%" height="260" style="border:0;border-radius:8px" allowfullscreen="" loading="lazy"></iframe>
  -->
            <div
                style="height:120px;display:flex;align-items:center;justify-content:center;background:#f1f7ff;border-radius:8px;border:1px dashed rgba(16,24,32,0.04)">
                <small class="slogan">Тут буде карта (iframe Google/Yandex)</small>
            </div>

            <div style="margin-top:10px;display:flex;gap:8px">
                <a class="btn" href="https://t.me/your_telegram" target="_blank" rel="noopener">Telegram</a>
                <a class="btn" href="https://wa.me/380XXXXXXXXX" target="_blank" rel="noopener">Viber</a>
            </div>
        </div>
    </div>
</section>
