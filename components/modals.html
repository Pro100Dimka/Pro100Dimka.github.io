<div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true"
    onclick="closeAllModals(event)">
    <div class="modal" id="orderModal" style="display:none" role="document" aria-labelledby="orderTitle">
        <h3 id="orderTitle">Замовити майстра</h3>
        <form onsubmit="return submitModalForm(event)">
            <label for="mname">Ім'я *</label>
            <input id="mname" required>
            <label for="mphone">Телефон *</label>
            <input id="mphone" required pattern="^\+?[\d\s\-()]{7,}$">
            <label for="mnotes">Коротко про роботу</label>
            <textarea id="mnotes" rows="3"></textarea>
            <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn" type="submit">Надіслати</button>
                <button type="button" class="ghost" onclick="closeModal('orderModal')">Скасувати</button>
            </div>
            <p id="modalMsg" class="slogan" style="margin-top:8px"></p>
        </form>
    </div>

    <div class="modal" id="priceModal" style="display:none" role="document" aria-labelledby="priceTitle">
        <h3 id="priceTitle">Дізнатися ціну</h3>
        <p class="slogan">Вкажіть коротко: тип робіт та площа — наш менеджер зв'яжеться для точної оцінки.</p>
        <form onsubmit="return submitPriceForm(event)">
            <label for="ptype">Тип робіт</label>
            <select id="ptype">
                <option>Ремонт санвузла</option>
                <option>Косметичний ремонт</option>
                <option>Капітальний ремонт</option>
                <option>Укладання плитки</option>
            </select>
            <label for="psize">Площа (м²)</label>
            <input id="psize" type="number" min="1" placeholder="Наприклад, 20">
            <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn" type="submit">Відправити</button>
                <button type="button" class="ghost" onclick="closeModal('priceModal')">Закрити</button>
            </div>
            <p id="priceMsg" class="slogan" style="margin-top:8px"></p>
        </form>
    </div>

    <div class="modal" id="feedbackModal" style="display:none" role="document" aria-labelledby="feedbackTitle">
        <h3 id="feedbackTitle">Залишити відгук</h3>
        <form onsubmit="return submitFeedback(event)">
            <label for="fname">Ім'я</label>
            <input id="fname" required>
            <label for="ftext">Відгук</label>
            <textarea id="ftext" rows="4" required></textarea>
            <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn" type="submit">Надіслати</button>
                <button type="button" class="ghost" onclick="closeModal('feedbackModal')">Скасувати</button>
            </div>
            <p id="fmsg" class="slogan" style="margin-top:8px"></p>
        </form>
    </div>
</div>
